# ---------------------------------------------------------------------------
# 10. 제작본 파싱 — 가정 금지 목록
#     기계가 "이런 가정을 하지 않았는가" 를 검사하기 위한 항목
# ---------------------------------------------------------------------------
deck_parsing_assertions:
  - id: V-090
    rule_ref: R-090
    name: placeholder idx 고정 가정 금지
    severity: fatal
    confidence: 확정
    forbid: "sub_title/top_ment 를 idx 상수로 판정"
    require: "top_cm 기준 판정"
    evidence: "deck:SKEE sub=13/ment=12  vs  deck:LG 79장 전부 반대(idx12=sub T2.62, idx13=ment T3.42)"

  - id: V-091
    rule_ref: R-091
    name: 문항코드 존재 가정 금지
    severity: fatal
    confidence: 확정
    require: "문항코드 없으면 slide_title+sub_title 폴백"
    evidence: "deck:LG 79/79 있음  vs  deck:SKEE 0/84 (소제목 shape 자체가 없다)"

  - id: V-092
    rule_ref: R-083
    name: 제작팀 메모 존재 가정 금지
    severity: high
    confidence: 확정
    require: "메모 0건이면 형태 기반 클론 탐지로 폴백"
    evidence: "deck:LG 71장  vs  deck:SKEE 0장"

  - id: V-093
    rule_ref: R-092
    name: Base 박스 위치 고정 가정 금지
    severity: high
    confidence: 확정
    require: "텍스트 패턴 '[Base:' 로 탐색"
    evidence: "다단 슬라이드에서는 T=17.13 우측정렬이 아니다"

  - id: V-094
    rule_ref: R-095
    name: 표 열 수 상수 가정 금지
    severity: medium
    confidence: 확정
    evidence: "deck:LG 본문 표 열 수 8/9/11/12/15/16/17/24"

  - id: V-095
    rule_ref: R-044
    name: 순위 판별을 계열 수로 하지 않는다
    severity: high
    confidence: 확정
    forbid: "BAR_CLUSTERED AND real_series_count==2 AND overlap==100"
    require: series_share_categories
    evidence: "deck:LG 계열수 기준 오탐 8건 / 카테고리 공유 기준 오탐 0건"

  - id: V-096
    rule_ref: R-093
    name: 제작본 == 가이드 가정 금지
    severity: low
    confidence: 확정
    evidence: "제목 변경 실측 — '2. 건설사 대비 당사 수준' → '2. 경쟁사 대비 당사 수준'"

# ---------------------------------------------------------------------------
# 11. 채점 태그 (골든셋 하네스와 공유)
# ---------------------------------------------------------------------------
failure_tags:
  MENT-NUM:   {desc: 멘트 수치 오류,              severity: fatal}
  BASE:       {desc: Base 문자열·n 오류,          severity: high}
  TOPTEXT:    {desc: 그래프 상단 Text 누락/과다,  severity: high}
  TYPE:       {desc: 차트 타입 불일치,            severity: medium, note: 규칙 후보로 승격}
  SORT:       {desc: 정렬 오류,                   severity: medium}
  QA:         {desc: 문항 텍스트 불일치,          severity: medium}
