# 9. 제작가이드 제출 전 체크
# ---------------------------------------------------------------------------
pre_submit:
  - id: V-080
    name: Cover 필수 기입
    severity: high
    confidence: 확정
    required_cells: {C4: 보고서 Title, C6: 제출일}

  - id: V-081
    rule_ref: R-100
    name: _ 접두 시트 제거
    severity: fatal
    confidence: 확정
    check: "송부본에 이름이 '_' 로 시작하는 시트가 없어야 한다"

  - id: V-082
    rule_ref: R-038
    name: 숨은 시트 · VBA 보존
    severity: fatal
    confidence: 확정
    required_sheets: [Cover, PPT_data, 목차, 한글_data, ItemCheck_PPT, ItemCheck_한글,
                      Verification_PPT, Verification_한글, "Coding No", Basic_Set]
