  MENT-PICK:  {desc: 배너 선별 타당성,            severity: low}
  MAP:        {desc: 매핑 실패,                   severity: low, note: 별도 집계}
  LABEL:      {desc: 차트 라벨 위생(보기번호 접두), severity: high}

# ---------------------------------------------------------------------------
# 11-b. 채점 위생 — 빈칸 대 빈칸을 정답으로 세지 않는다 (R-088)
# ---------------------------------------------------------------------------
scoring_hygiene:
  - id: V-090
    rule_ref: R-088
    name: 공허 일치 금지
    severity: high
    confidence: 확정
    check: "정답과 예측이 **둘 다 비어 있는** 항목은 점수 분자·분모 어디에도 넣지 않는다"
    requires: "예측기는 `미구현`(null + status)과 `해당 없음`([])을 구분해 낸다"
    note: >
      라운드1 MENT 렌즈에서 빈칸-빈칸 74/74 가 발생했다. 100%로 보고하면
      '멘트 생성기 미구현'이 만점으로 위장된다.

# ---------------------------------------------------------------------------
# 12. 채점에서 제외 — 예시 파일 자체의 오류
# ---------------------------------------------------------------------------
known_example_defects_ref: ../knowledge/guide/chart_rules.yaml#known_example_defects

# ---------------------------------------------------------------------------
# 11. 목차 (RULES R-027~R-029, R-078) — 사용자 지시 I-021
# ---------------------------------------------------------------------------
toc:
  - id: V-100
    rule_ref: R-027
    name: 목차 전수성
    severity: medium
    confidence: 확정
    tag: TOC
    check: "설문지 전 문항이 `part 3 목차` 에 배정되거나 제외 사유가 명시돼야 한다"
    formula: "설문지 문항 수 == 배정된 문항 수 + 명시적 제외 수"
    exempt_prefixes: [SQ, DQ, ED]
    exempt_response_types: ["개방형"]
    note: |
      `part 3 목차(연구부 확인용)` 는 연구부 확인용이 아니라 **누락 검출용**이다.
      사람이 눈으로 훑어 빈 곳을 찾는 자리다.

  - id: V-101
    rule_ref: R-028
    name: 목차 항목명은 한 어절
    severity: medium
    confidence: 확정
    tag: TOC
    applies_to: ["Slide title", "Sub title"]
    forbid_tokens: [" 및 ", "및 ", " 및", "/", "·"]
    #: R-132 — 항목명은 명사(구) 종결. 서술어미·의문형으로 끝나면 문항 원문을 그대로 옮긴 것이다
    forbid_endings: ["다", "까", "요", "?", "니"]
    #: 끝 글자가 위 목록과 겹치지만 **명사**인 어절 — 마지막 어절이 여기 있으면 통과시킨다.
    #  「추가 위탁 수요」의 `수요` 를 서술어미 `~요` 로 오인해 12건을 경고하던 자리다
    #  (사용자 지시 2026-08-27). 새 낱말은 실제로 걸린 뒤에 추가한다 — 미리 채우지 않는다.
    exempt_ending_words: ["수요", "개요", "중요", "필요", "주요", "소요", "요요", "동요", "수요층"]
    exempt_prefixes: ["Part ", "PART ", "파트 "]
    #: 고정 섹션명 — 작명이 아니라 예시 파일이 못 박은 이름이라 쪼갤 대상이 아니다.
    #  번호 접두(`8. `)를 떼고 비교한다.
    exempt_names: ["결론 및 제언", "요약 및 결론"]
    #: 구조 블록(표지·목차·간지·조사개요·**요약·결론**)은 대상이 아니다.
    #  한 어절 규칙은 Part Ⅲ 조사 결과 목차의 작명 규칙이다 (R-028 · R-121).
    exempt_struct: true
    exempt_reason: |
      `Part Ⅱ. 요약 및 결론` 은 guide/10 §1 이 못 박은 **고정 Part 명**이다.
      §2-3② 의 적용 대상은 꼭지 이름(Slide/Sub title)이지 Part 명이 아니다.
      같은 이유로 Part Ⅱ 의 마지막 꼭지 `결론 및 제언` 도 면제다 — LG 홈로봇 예시가
      쓰는 고정 섹션명이고, 사용자가 "홈로봇처럼"이라고 이름째 지정했다(I-021 후속).
      **면제는 이 두 이름뿐이다.** 다른 곳에서 `및` 이 나오면 그것은 여전히 분할 신호다.
    check: "두 개념을 잇는 표시가 있으면 항목을 쪼갠다"
    fix_direction: "문구를 다듬지 말고 **항목을 분할**한다"
    note: |
      예시 파일(LG·SKEE)은 이 규칙을 지키지 않는다 (`1) 상호작용 및 역할 분담 체계` 등).
      사용자 규칙이 예시보다 우선한다 — 예시는 포맷의 근거이지 작명의 근거가 아니다.

  - id: V-102
    rule_ref: R-029
    name: 목차 MECE (상호배타)
    severity: medium
    confidence: 확정
    tag: TOC
    check: "같은 통계표가 두 블록에 배정되지 않았는가"
    key: source_tables
    not_key: question_code
    note: |
      **문항코드로 세면 안 된다.** 매트릭스 척도(A8 7항목·D6 5항목·C2 7항목)나
      다항목 숫자입력(A1 지상/지하/엘리베이터/총층수)은 한 문항이 여러 표를 갖는 게 정상이다.
      중복의 단위는 문항이 아니라 **표**다.

  - id: V-103
    rule_ref: R-078
    name: Part Ⅱ 결론의 출처
    severity: high
    confidence: 확정
    tag: TOC
    check: "결론·제언의 각 항목이 같은 Part 의 요약 꼭지로 되짚어지는가"
    machine_checkable: false
    human_check: |
      결론 항목마다 근거 요약 꼭지 번호를 적어 두고 매칭되지 않는 항목이 없는지 본다.
      되짚을 수 없으면 그 근거를 요약에 올리거나 그 결론을 버린다.
    note: "보고서 구조상 **요약이 결론의 유일한 백데이터**다."
