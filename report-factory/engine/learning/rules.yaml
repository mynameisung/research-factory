unfilled_markers:
  - id: V-070
    name: 미기입 마커 잔존
    severity: fatal
    confidence: 확정
    search_strings: ["???", "내용을 입력하세요", "텍스트를 입력", "Data 입력"]
    scope: 덱 전체
    example_defects:
      - "deck:LG#s26-29  【TOP2】 ???%  /  【BOT2】 ??? %"
      - "deck:LG#s2      내용을 입력하세요 (목차)"
      - "deck:LG#s14     내용을 입력하세요 (결론)"

