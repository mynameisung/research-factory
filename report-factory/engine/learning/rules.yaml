    required_hidden: [PPT_data, 목차, 한글_data, ItemCheck_PPT, ItemCheck_한글,
                      Verification_PPT, Verification_한글, "Coding No"]

  - id: V-083
    name: 수식 평탄화
    severity: medium
    confidence: 확정
