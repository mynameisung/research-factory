# 4-b. 순위 겹침막대 판별 — ★ 계열 수로 판별하면 틀린다
# ---------------------------------------------------------------------------
ranking_detection:
  id: CT-045                      # 근거 ID 를 남긴다 (검수관 제안 R-D). 규칙 카드는 R-044 / R-087
  rule_ref: [R-044, R-087]
  wrong_rule: "BAR_CLUSTERED AND real_series_count == 2 AND overlap == 100"
  wrong_rule_false_positives: 8
  wrong_rule_note: >
    여분 계열이 순위 오버레이가 아니라 **특정 보기만 다른 색으로 칠하려고 쪼갠 더미**인 경우가 있다.
    실측된 더미 계열명: 'do not know', '열2', 배너 그룹 헤더 문자열 등.
  correct_rule: series_share_categories
  correct_rule_definition: >
    두 계열이 카테고리(보기 라벨)를 공유하는가로 판별한다.
    순위 오버레이 = 두 계열이 **전 카테고리를 공유**한다 (1순위 값과 1~N순위 값이 같은 보기에 붙는다).
    색분리용 더미 = 카테고리를 **하나도 공유하지 않는다** (한 계열이 값을 가지면 다른 계열은 빈칸).
  pseudo: |
    def is_rank_overlay(chart):
        if chart.chart_type_id != 57 or chart.real_series_count < 2:
            return False
        a, b = chart.series[0], chart.series[1]
        shared = sum(1 for x, y in zip(a.values, b.values)
                     if x is not None and y is not None)
        return shared == len([v for v in a.values if v is not None])
  confidence: 확정
  evidence: ["deck:LG 실측 — 계열수 기준 오탐 8건, 카테고리 공유 기준 오탐 0건"]

# ---------------------------------------------------------------------------
# 4-c. 옵션축 — ★ 통계표 행 순서 ≠ 차트 옵션축 순서
#      가이드 그리드는 통계표 순서를 그대로 유지한다(그건 바꾸지 않는다).
#      바뀌는 것은 **차트가 보여주는 축**이다. 두 개는 다른 산출물이다.
#      라운드1 실측: 예측이 이 둘을 같은 것으로 취급해 SORT 0/53 이 났다.
# ---------------------------------------------------------------------------
option_axis:
  contract: >
    decision_table 의 `then.option_axis` 가 이 표의 모드를 고른다. 지정이 없으면 table_order.
    산출물 두 개를 모두 낸다 — `table_row_order`(가이드 그리드) / `option_order`(차트 옵션축).

  label_sanitize:
    id: LABEL-010
    rule: '차트 라벨에서 보기번호 접두 `N) ` 만 제거한다. 라벨에 내재된 번호(`8. 공간형 침실/욕실 청소`,
           `A. 소유방식`)는 그대로 둔다.'
    regex: '^\s*\d+\)\s*'
    applies_to: [option_order]          # 가이드 그리드(label_raw)는 원문 간격·번호를 보존한다
    confidence: 확정
    evidence:
      - "deck:LG 본문 79장 전 차트 라벨에 `N)` 접두 0건"
      - "deck:LG#s80 C2 `8. 공간형 침실/욕실 청소` — 마침표형 번호는 유지된다"
      - "deck:LG#s96 A17 `A. 소유방식` — NET 행 머리글자도 유지된다"

  modes:
    table_order:
      rule: 통계표(가이드 블록)가 준 보기 행 순서를 그대로 쓴다. DP가 이미 정렬해 준다.
      confidence: 확정
      evidence: ["deck:LG#s17 A1", "deck:LG#s30 A16", "deck:LG#s44 BA3", "deck:LG#s72 BE3", "deck:LG#s96 A17"]

    scale_diverging:
      id: SORT-010 / SORT-011
      rule: >
        척도(+-세로막대)에서 보기는 카테고리가 아니라 **계열**이다. 카테고리축은 배너다.
        계열 순서는 중앙에서 바깥으로 두 덩어리 — 양의 반쪽(중앙점+1 → 최고점),
        음의 반쪽(중앙점 → 1점). 중립점(4점/3점)은 음의 반쪽에 들어간다.
      neutral_point: "(N+1)//2"          # 7점 → 4점, 5점 → 3점
      group_order: positive_first         # LG 하우스 컨벤션
      labels: '"{점수}점" (보기 라벨이 점수 숫자로 시작하는 수치형 척도일 때). 어의형 척도는 라벨 유지'
      completeness: 값이 0%라 통계표에서 빠진 척도점도 계열로 복원한다 (SORT-011)
      confidence: 확정
      evidence:
        - "deck:LG 척도 36/36 — series ['5점','6점','7점','4점','3점','2점','1점']"
        - "guide:LG#BA1-2/BA2/BE1-2/BE1-4/BE2/BF1-2 — 0% 척도점 행이 통계표에서 빠졌으나 제작본 계열은 7개"
      caveat_group_order:
        observed_SKEE_5점: "['보통','불만족','매우 불만족','만족','매우 만족'] = [3,2,1,4,5] → negative_first"
        note: >
          반쪽의 구성(중앙→바깥)은 두 덱이 같고 **덩어리 순서만** 다르다. 누적 세로막대에서
          두 배치는 시각적으로 동일하다(양수는 위로, 음수는 아래로 쌓이므로).
          G1 은 positive_first 로 확정, 5점 척도의 덩어리 순서는 OPEN_QUESTIONS Q-SORT-01.

    grade_stack_reverse:
      id: SORT-020
      rule: >
        등급 사다리 누적 100% 가로막대에서 보기는 **계열**이고, 통계표 행 순서의 역순으로 쌓는다
        (통계표는 최상위 등급부터, 차트는 최하위 등급부터).
      confidence: 검증중
      evidence:
        - "deck:LG#s25-29 A10-1~5 — 계열 ['절대 비허용','드물게 허용','간헐적 허용','일상적 허용']"
        - "guide:LG#A10-1..5 통계표 행 ['1) 일상적 허용','2) 간헐적 허용','3) 드물게 허용','4) 절대 비허용']"
      caveat: 관찰이 A10 한 문항군(5장)뿐이다. 독립 표본 1건 → OPEN_QUESTIONS Q-SORT-02.

    rank_sum_desc:
      id: SORT-030
      rule: >
        순위 문항의 카테고리축 정렬키는 **1+N순위 합** 내림차순이다 (1순위 값이 아니다).
        동점은 통계표 원순서를 유지한다(안정 정렬).
        대표값 열(멘트·정렬에 쓰는 '전체')도 1순위가 아니라 1+N순위 열이다.
      confidence: 확정
      evidence:
        - "deck:LG#s80 C2 — 카테고리 15개가 1+2+3순위 값(47,36,34,31,19,18,17,17,16,15,14,11,10,10,5) 내림차순, 동점 2/4·14/15 는 원순서 유지"
        - "guide:LG#C2 통계표는 시나리오 원순서(1..15)로 들어온다 — DP가 정렬해 주지 않는 케이스가 실재한다"
        - "transcript:28:46, transcript:29:04 — 정렬은 1~N순위 기준, 1순위 표에서는 전체 열만 가져온다"
      note: >
        A8 처럼 DP가 이미 1+2+3순위 내림차순으로 정렬해 주는 표도 많다. 이 규칙은 그 경우
        결과를 바꾸지 않는다(안정 정렬이므로 항등). 정렬을 하지 않는 쪽이 위험하다.

  etc_last:
    id: SORT-040
    rule: '`기타` · `잘 모르겠다` · `해당 없음` 류 보기는 값 정렬에서 제외하고 최하단에 고정한다.'
    match: ['^기타', '모르겠다', '해당\s*없음', '없음$', '상황에 따라']
    applies_to: [table_order, rank_sum_desc]
    confidence: 검증중
    evidence:
      - "deck:LG#s20 A5 — 통계표는 값 내림차순으로 `4) 잘 모르겠다 / 상황에 따라 다르다`(13%)를 2번째에 두었으나 제작본 차트는 최하단"
      - "deck:LG#s20 A5 — 이 보기만 별도 계열('do not know')로 분리해 색을 달리한다"
      - "deck:LG#s30 A16 · s23 A8 — 해당 보기가 이미 최하단이라 규칙과 충돌하지 않음"
    caveat: 위치를 바꾼 실측 관찰은 A5 1건이다 → OPEN_QUESTIONS Q-SORT-03.
    not_implemented:
      - "`기타·모름` 보기를 별도 계열로 분리하고 색을 달리하는 부분(deck:LG#s20 `do not know` 계열)은
         아직 산출하지 않는다. 순서만 맞춘다."

# ---------------------------------------------------------------------------
# 4-d. 표 행 순서 — ★ 정렬 결과는 그래프에만 걸리는 게 아니다
#      라운드2 실측: 정렬 규칙이 option_order 에만 걸리고 table_row_order 에는
#      안 걸려 A5·C2 가 틀렸다 (표 행 순서 13/15).
# ---------------------------------------------------------------------------
table_row_axis:
  id: SORT-045
  contract: >
    제작본 **배너표**의 데이터 행 순서다. 가이드 그리드(.xlsm)의 행 순서와도,
    차트 옵션축과도 구분되는 세 번째 산출물이다 — `guide_grid_row_order` / `option_order` /
    `table_row_order` 세 개를 모두 낸다.
  rule: >
    갈림길은 하나다 — **보기가 카테고리축인가, 계열인가.**
      - 보기 = 카테고리축 (가로막대 · 가로겹침막대 · 순위) → 표 행 순서 = 차트 옵션축 순서.
        값 내림차순(SORT-030)도 기타·모름 최하단(SORT-040)도 표에 똑같이 걸린다.
      - 보기 = 계열 (척도 발산 · 등급 사다리 누적 100%) → 표는 통계표 순서를 유지한다.
        그래프는 계열을 쌓는 순서이므로 표와 같을 이유가 없다.
  series_axis_modes: [scale_diverging, grade_stack_reverse]
  label_sanitize: 적용            # 제작본 표에도 `N) ` 접두가 없다 (LABEL-010)
  confidence: 확정
  evidence:
    - "deck:LG 실데이터 슬라이드 전수 — 카테고리형 10장(s17·s20·s23·s30·s44·s72·s80·s81·s82·s90)에서 표 행 == 차트 카테고리"
    - "deck:LG#s20 A5 — 통계표는 `1) 상주형 / 4) 잘 모르겠다 / 2) / 3)` 인데 표도 차트도 `상주형·정기적 방문자·업무형 방문자·잘 모르겠다`"
    - "deck:LG#s80 C2 — 표 15행이 차트와 같은 1+2+3순위 내림차순"
    - "deck:LG#s25-29 A10 — 표는 통계표 정순(일상적→절대 비허용), 차트 계열은 역순. 두 순서가 **달라야** 맞다"
    - "deck:LG 척도 36장 — 표에 보기 행 자체가 없다(범례 한 덩어리 + TOP3/평균 행). 충돌하지 않는다"
  note: >
    라운드2 에서 75개 예측 중 44개가 option_order ≠ table_row_order 였는데,
    그중 41개(척도 36 · 누적100% 5)는 **달라야 맞는** 것이었고 실제 오류는 A5·C2 계열이었다.
    "전부 같게" 도 "전부 다르게" 도 오답이다. 유형별 분기가 답이다.

# ---------------------------------------------------------------------------
# 4-e. 그래프 상단 Text 의 **매체** — ★ 같은 지표라도 매체가 다르면 표기가 다르다
#      라운드2 실측: 라벨 표기 5/41. 척도 36장에 A10 전용 표기(【】)를 밀어 넣었다.
# ---------------------------------------------------------------------------
graph_top_text:
  id: TT-010
  contract: >
    `decision_table.then.graph_top_text_medium` 이 매체를 고른다. 지정이 없으면 `표 상단 행`.
    산출물은 라벨 배열이 아니라 **매체·배치·단위·수치**를 실은 레코드다.
  media:
    표 상단 행:
      where: 배너표의 맨 위 두 행 (표가 그래프 위에 온다)
      label_format: {top: "TOP{k}(%)", bot: "BOT{k}(%)", soso: "SoSo(%)", mean: "{scale_points}점 평균(점)"}
      order: [top, mean]
      carries_banner_values: true       # 배너별 값을 함께 싣는다
      confidence: 확정
      evidence:
        - "deck:LG 척도 36/36 — 표 top=6.17cm · 차트 top=7.12cm, 표 1행 `TOP3(%)`, 2행 `7점 평균(점)`"
        - "deck:LG#s38 BA1-1 — TOP3(%) 행이 배너 11개 값(58.0/75.0/44.1/…)을 함께 싣는다"
    독립 TextBox:
      where: 막대 좌우 끝에 겹쳐 붙이는 텍스트 상자
      label_format: {top: "【TOP{k}】", bot: "【BOT{k}】"}
      order: [bot, top]                 # 좌 → 우
      value_on_next_line: true          # `【TOP2】⏎60.0 %`
      confidence: 확정
      evidence:
        - "deck:LG#s25 A10-1 — TextBox 2개: 【BOT2】 L=6.67 / 【TOP2】 L=22.61, 둘 다 T=9.17 (차트 6.17~10.57 구간에 겹침)"
        - "deck:LG 누적100% 5/5 동일 구조. 척도 36장에는 이 TextBox 가 0개다"
  note: >
    통계표(가이드) 센티널 라벨 `【TOP3】` · `[7점 평균]` 은 **통계표 표기**다. 그대로 제작본에
    옮기면 안 된다. 한 예측 안에서 브래킷이 `【】` 와 `[]` 로 섞이던 것도 여기서 통일된다.
    누적100% 슬라이드는 표 **하단**에도 `TOP2(%)` `BOT2(%)` 행을 따로 갖는다(deck:LG#s25).
    그건 통계표 요약행이지 `그래프 상단 Text` 가 아니다 — 두 매체를 한 배열로 접지 않는다.
  not_implemented:
    - "NPS 표기(`NPS(점)`)는 LG·SKEE 본문에 노출 0회 → 가설. 관측되면 확정으로 올린다"

# ---------------------------------------------------------------------------
# 5. 행 단위 수식어 — 데이터 행의 "블록 값 열"에 적는다
# ---------------------------------------------------------------------------
row_modifiers:
  - string: "그래프 상단 Text"
    applies_to_rows: [top, mean]
    effect: 해당 값을 그래프 위에 숫자로 표시
    required: true
    freq: {LG: 77, SKEE: 86}
    confidence: 확정
    evidence: ["transcript:33:10", "transcript:33:52"]
    note: 안 적으면 안 나온다. 【BOT】·【SoSo】에는 붙이지 않는다 (transcript:34:40)
    conditional_format: 'cellIs equal "그래프 상단 Text" → 글자 빨강(FFFF0000)'
  - string: "100%세로막대"
    applies_to_rows: [option]
    effect: 해당 행들을 100% 세로막대 계열로
    freq: {LG: 0, SKEE: 45}
    confidence: 확정
  - string: "text"
    applies_to_rows: [mean]
    effect: 차트가 아니라 텍스트로 표기
    freq: {LG: 0, SKEE: 14}
    confidence: 확정
  - string: "가로막대"
    applies_to: 패널제목행
    freq: {LG: 0, SKEE: 24}
    confidence: 확정
  - string: "세로막대"
    applies_to: 패널제목행
    freq: {LG: 0, SKEE: 1}
    confidence: 확정
  - string: "그래프 색"
    applies_to_rows: [option]
    effect: 계열 색 별도 지정
    freq: {LG: 0, SKEE: 2}
    confidence: 확정
  - string: "각 그래프마다 base 표기"
    applies_to: 패널
    freq: {LG: 0, SKEE: 1}
    confidence: 확정
  - string: "그래프 상단에 평균 표 표기"
    applies_to_rows: [mean]
    freq: {LG: 0, SKEE: 3}
    confidence: 확정

# ---------------------------------------------------------------------------
# 6. 레이아웃 지시 — 패널 옆 빈 셀
# ---------------------------------------------------------------------------
layout_directives:
  - {string: "1/3 공간만 만들어주세요", freq: {SKEE: 13}, confidence: 확정}
  - {string: "하단에 1/3 공간만 만들어주세요", freq: {SKEE: 5}, confidence: 확정}
  - {string: "1/2 공간만 만들어주세요", freq: {SKEE: 1}, confidence: 확정}
  - {string: "1/3 공간만 만들어주세요 (불만족 정성 사유)", freq: {SKEE: 1}, confidence: 확정,
     note: 괄호로 용도를 부기해도 된다}
  - {string: "참고 이미지", freq: {SKEE: 1}, confidence: 확정}
  - {string: "TEXT 박스", freq: {SKEE: 2}, confidence: 확정}

# ---------------------------------------------------------------------------
# 7. Base/Unit 문자열
# ---------------------------------------------------------------------------
base_unit:
  pattern: "[Base: {서브샘플정의}(n={N})/ Unit: {단위}]"
  units: ["%", "%, 중복", "%, 점", "점,%", "%(TOP2)", "%, 3개 문항 응답"]
  footnote_line2:
    # ★ 각주 어휘는 프로젝트마다 다르다. 한 덱에 전부 있는 게 아니다.
    - {string: "*Too small base(n<30)", rule: "n < 30 인 배너 셀이 하나라도 있는 표",
       source: "deck:LG (LG 덱의 각주는 이것 하나뿐이다)", confidence: 확정}
    - {string: "* 소수 응답 생략", source: "guide:SKEE", confidence: 확정}
    - {string: "* 1+2+3순위 기준 10% 미만 제외", source: "guide:SKEE", confidence: 확정}
  placement_note: >
    단단 슬라이드에서는 Base 박스가 T=17.13 우측정렬에 놓이지만,
    **다단 슬라이드에서는 고정 위치가 아니다.** 위치로 Base 박스를 찾지 말고
    텍스트 패턴(`[Base:` 로 시작)으로 찾는다.
  n_omitted_when: 행마다 base 가 다를 때   # "[Base: 각 관리자별 관련 업무 경험자/ Unit: %, 점]"
  forbidden:
    - {string: "[Base : 전체 응답자(n=1,000), Unit : %]",
       reason: "콜론 앞 공백 / '/' 대신 ',' / n 오기",
       evidence: ["deck:LG#s6"]}

# ---------------------------------------------------------------------------
# 8. 배너 절단 — ★ 위치가 아니라 그룹명으로 자른다
# ---------------------------------------------------------------------------
banner_cut:
  method: group_name          # NOT column_index
  confidence: 확정
  evidence: ["transcript:07:44", "transcript:08:24", "tables.json#banner 열 수 15~45 로 표마다 다름"]
  note: >
    DP가 base 0 인 배너 범주를 표마다 통째로 빼기 때문에 열 수가 고정이 아니다.
    비상주 실측: 전체 배너 열 15~45, 보고서 IN 열 6~17.
    표42(B8)·표56(C4-1)에는 오히려 배너군이 하나 더 붙어 있다
    (`가장 중요한 위탁 서비스`, `우선 도입 희망 업무` — 각 7표).
    위치 기준으로 자르면 깨진다. 반드시 그룹명 화이트리스트로 판정한다.
  project_example_비상주:
    in_groups: [전체, 용도, 권역, 관리 운영 방식]
    out_groups: [건물 연면적, 소유 형태, 지역지구, 건물 준공연도, 입주사 수,
                 가장 중요한 위탁 서비스, 우선 도입 희망 업무]
    in_columns_typical: 17
    in_columns_range: [6, 17]

# ---------------------------------------------------------------------------
# 9. 물리 상한 — 열 수 초과 시 열폭 축소 또는 장분리
# ---------------------------------------------------------------------------
column_limits:
  # ★ 고정 상한이 아니다. 표 전체 폭만 고정이고 열 너비는 슬라이드마다 다시 잡는다.
  invariant:
    table_total_width_cm: 32.0        # 16:9 (33.87cm) 덱. 이건 고정
    confidence: 확정
    evidence: ["deck:LG 본문 표 전량"]
  observed_col_counts_LG: [8, 9, 11, 12, 15, 16, 17, 24]
  observed_leading_col_width_profiles: 5
  note: >
    LG 본문 표의 열 수가 8~24 로 제각각이고, 제작팀은 전체 폭 32.0cm 를 유지한 채
    선두 열 너비 프로파일(5종)과 배너 열 너비를 슬라이드마다 다시 잡는다.
    "1.5cm × 14열" 은 상한이 아니라 흔한 한 경우일 뿐이다.
    **지식 문서나 룰 엔진에 열 수 상한을 못박지 않는다.**
    실무 판단은 "열이 많아 좁아 보이면 열폭 축소, 그래도 안 되면 장분리" 이고,
    최종 결정은 제작팀·연구원과 첫 5장 리뷰에서 맞춘다.
  overflow_action: [열폭 축소, 장분리]
  evidence: ["transcript:07:59", "deck:LG#표 col_widths_cm 가변", "제작팀 메모 '장분리'"]

# ---------------------------------------------------------------------------
# 10. 소수점
# ---------------------------------------------------------------------------
decimals:
  percent: 1
  mean: 2
  nps: 2
  keep_trailing_zero: true       # 33.0 을 33 으로 줄이지 않는다
  rounding: ROUND_HALF_UP        # banker's rounding 아님
  source_value: display          # 저장된 무한소수가 아니라 서식 적용 후 값
  confidence: 확정
