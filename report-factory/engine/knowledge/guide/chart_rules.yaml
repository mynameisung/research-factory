# 14. 채점 위생 — 빈칸 대 빈칸을 정답으로 세지 않는다
# ---------------------------------------------------------------------------
scoring_hygiene:
  vacuous_match:
    rule: 정답과 예측이 둘 다 비어 있는 항목은 분자·분모 어디에도 넣지 않는다
    reason: >
      라운드1 멘트 렌즈에서 빈칸-빈칸 74/74 가 발생했다. 100% 로 보고하면
      '멘트 생성기 미구현' 이 만점으로 위장된다. 환각 0건도 방어 성공이 아니라 측정 미실시다.
    requires: '예측기는 `미구현`(ment=null + ment_status)과 `해당 없음`(ment=[])을 구분해 낸다'
    confidence: 확정
  lens_scope:
    MENT-NUM:   {G1: 채점하지_않음, G2: 채점}
    MENT-STYLE: {G1: 채점하지_않음, G2: 채점}
    MENT-PICK:  {G1: 채점하지_않음, G2: 채점}
    reason: "deck:LG 본문 79/79 top_ment 공백 (§6-1). 대조할 정답 멘트가 없다"
    deck_profile: >
      '멘트 없는 덱' 은 결함이 아니라 **덱 프로파일**이다 (검수관 제안 R-MENT-040).
      LG 는 멘트를 PPT 에 쓰지 않고, SKEE 는 84/84 채운다. 프로젝트 시작 시 어느 쪽인지
      확인하고, 멘트 없는 덱이면 멘트 렌즈를 모수 0 으로 **자동 SKIP** 하고 그렇게 보고한다.
      0/0 을 100% 로도 0% 로도 쓰지 않는다.

  # ── 라운드2 — 모수를 문항코드 수로 잡지 않는다
  denominator:
    rule: >
      채점 모수는 **정답 본문 슬라이드 수**다. `고유 문항코드 수` 로 잡으면 안 된다.
      한 문항이 배너 때문에 두 장으로 갈리기 때문이다 (MAP-050 / R-089).
    observed: "deck:LG 본문 79장 ↔ 고유 문항코드 75개 (C2-1/C2-2/C2-3 · C3 · C3-1/C3-2/C3-3 · C4 가 각 2장)"
    join_key: "`question_code` + `chapter`. 코드만으로 조인하면 2장째가 조용히 사라진다"
    confidence: 확정
    rejects: >
      검수관 제안 R-F("본문 슬라이드 수 = 고유 문항코드 수 가정을 유지하라")는 **반례로 기각**한다.
      그 가정이 라운드1 에서 정답 4장을 결함으로 몰아낸 원인이다.
