# 차트 타입 결정 규칙 — 기계 판독용
#
# 소비자: engine/tools/rules.py (결정), engine/tools/verify.py (검증)
# 사람용 해설: guide/12_차트타입-결정표.md
#
# 근거 표기
#   transcript:MM:SS        인수인계 녹취 20260821
#   guide:<파일>#<블록키>    예시 제작가이드 실측 (engine/refs/guide_blocks_*.json)
#   deck:<파일>#s<슬라이드>  예시 제작본 실측 (engine/refs/ground_truth_*.json)
#
# 신뢰도: 확정 / 검증중 / 가설

schema_version: "1.1"
generated_at: "2026-08-22"
sources:
  transcript: handover/20260821_서연_인수인계_녹취록.md
  guides:
    - engine/refs/guide_blocks_LG홈로봇.json   # 93 blocks, 90 with chart_type
    - engine/refs/guide_blocks_SKEE.json       # 109 blocks, 104 with chart_type
  decks:
    - engine/refs/ground_truth_LG홈로봇.json    # 99 slides, 79 본문
    - engine/refs/ground_truth_SKEE.json        # 126 slides, 84 본문

# ---------------------------------------------------------------------------
# 0. 입력 계약 — 룰 엔진에 들어오는 것
#    tables.json 의 table.hints + questionnaire.json 의 question.response_type
#    + 목차 설계에서 정해지는 slide_role
# ---------------------------------------------------------------------------
input_contract:
  slide_role:
    source: 목차 설계 (guide/10)
    domain: [표지, 목차, 간지, 응답자특성, 본문, 요약, 결론, 부록]
  question:
    response_type:
      source: questionnaire.json#questions[].response_type
      domain: [단일, 복수, 순위, 척도, 행렬, 예-아니오, 숫자입력, 개방형]
      observed_비상주: {단일: 20, 순위: 9, 척도: 9, 복수: 8, 숫자입력: 5, 개방형: 3, 행렬: 3, 예-아니오: 1}
      note: >
        n_scale=11 은 척도 9 + 행렬 중 척도형 2(A8, D6). 행렬 여부는
        table.hints.is_matrix_item 으로 다시 갈린다. 문항 유형만으로 판단하지 말고
        표(hints)를 우선한다 — 표가 실측이고 설문지는 의도이기 때문이다.
  table:
    # tables.json#tables[].hints 를 그대로 받는다
    has_scale_rows:   {type: bool,  note: "【BOT】【SoSo】【TOP】 요약행 존재"}
    scale_points:     {type: int|null, domain: [null, 5, 7, 10]}
    is_ranking:       {type: bool}
    rank_scope:       {type: str|null, domain: [null, "1", "1~2", "1~3"]}
    rank_is_first_only: {type: bool, note: "제목이 _1순위 인 표"}
    is_multi:         {type: bool,  note: "(중복응답)"}
    is_summary:       {type: bool}
    summary_kind:     {type: str|null, domain: [null, top2, mean]}
    is_matrix_item:   {type: bool}
    has_total_row:    {type: bool,  note: "'      계' 행"}
    has_mean_row:     {type: bool,  note: "[N점 평균] 행"}
    n_option_rows:    {type: int}
    n_banners:        {type: int,   note: "표마다 다르다. 비상주 실측 15~45"}
    n_banners_in_report: {type: int, note: "비상주 실측 6~17"}

# ---------------------------------------------------------------------------
# 0-b. 본문 게이트 — ★ "표가 있으면 본문" 이 아니다
#      라운드1 실측: 조사개요·요약 블록 4개가 본문으로 산출됐다 (MAP 정밀도 94.9%).
# ---------------------------------------------------------------------------
body_slide_gate:
  id: MAP-020
  rule: >
    본문 구간은 `조사 결과` Part 간지 **이후**의 블록이다. 그 앞(표지·목차·조사 개요·
    요약 및 결론)은 통계표를 품고 있어도 본문 예측 대상이 아니다.
  detect_part_marker:
    pattern: '^\s*Part\s'          # slide_title 이 Part 로 시작하는 블록 = 파트 간지
    prefer_title_contains: ["조사 결과", "조사결과", "조사 결과 "]
    fallback: 마지막 Part 간지
    on_no_marker: 게이트를 적용하지 않는다   # 못 찾으면 현행 동작 유지 (회귀 방지)
  confidence: 확정
  evidence:
    - "guide:LG#block14 'Part Ⅲ. 조사 결과' — 이후 블록 78개가 제작본 본문 79장에 대응"
    - "guide:LG#block5(3. 응답자 특성)·block9·block10·block11 — Part Ⅱ 이하, 제작본에서는 조사개요/요약 레이아웃"
    - "deck:LG#s6 layout=2_master-1(조사개요), s10-s12 layout=master-1(요약)"
    - "guide:SKEE#block30 'Part Ⅲ. 조사 결과' — 같은 구조. 앞선 요약 블록 19개가 같은 오탐 후보였다"
  note: >
    제작본 레이아웃(3_master-1)으로 판정할 수 있으면 그게 더 정확하지만, 예측 단계에서는
    제작본을 볼 수 없다. 가이드에서 쓸 수 있는 구조 신호가 Part 간지다.
    문항코드 유무로 가르면 안 된다 — SKEE 가이드는 문항코드가 0건이다(DP-002).

# ---------------------------------------------------------------------------
# 0-c. 장분리 — ★ 한 문항이 슬라이드 두 장으로 전개되는 케이스
#      라운드2 실측: 정답 79장 중 4장을 통째로 못 냈다 (MAP 재현율 94.9%).
#      쪼개지는 것은 문항이 아니라 **배너**다. 차트(전체)는 두 장에 똑같이 들어간다.
# ---------------------------------------------------------------------------
chapter_split:
  id: MAP-050
  enabled: true
  rule: >
    배너 열이 한 장에 안 들어가면 **배너군 경계**에서 장(章)을 나눈다.
    마지막 배너군을 떼어 2장째로 보내고, 선두의 1열짜리 군(`전체` · `1순위` · `1+N순위`)은
    양쪽 장에 모두 싣는다. 차트는 전체 값만 그리므로 두 장이 동일하다 —
    두 장의 차트가 같은 것은 복제 흔적이 아니라 정상이다.
  max_banner_columns: 22          # 초과하면 분리
  min_tail_group_columns: 3       # 떼어 낼 마지막 배너군의 최소 열 수
  carry_leading_single_columns: true
  guards:                         # 셋 다 만족할 때만 나눈다. 없는 신호로 장을 복제하지 않는다
    - 2단 배너 헤더(그룹행 + 라벨행)가 실재한다
    - 다열 배너군이 2개 이상이다
    - 마지막 배너군이 min_tail_group_columns 이상이다
  confidence: 검증중
  evidence:
    - "guide:LG#block80 C2-1/C2-2/C2-3 배너 27열 → deck:LG s81(전체+나이4+가구2+선호유형4=11열) + s82(전체+시나리오15=16열)"
    - "guide:LG#block81 C3 27열 → deck:LG s83 + s84 · block82 C3-1/… 27열 → s85 + s86 · block83 C4 27열 → s87 + s88"
    - "s82/s84/s86/s88 의 표 `(Base)` 행 값이 가이드 P~AD 열(시나리오별 15배너)과 **전량 일치**한다 — 복제본이 아니라 실재하는 2장째다"
    - "guide:LG#block92 C2-1-1/… 배너 22열 → deck:LG s97 **1장** (표 9x24, 열폭 1.0cm 로 압축). 22열은 분리하지 않는다"
    - "guide:LG 본문 82블록 전수: 27열 4건 = 전부 2장 / 22열 이하 78건 = 전부 1장. 분리 완전"
  note: >
    ★ 라운드1 은 이 4장을 `미제작 클론` 으로 오판해 채점 모수에서 뺐다(GOLDEN_SET §5-g-1 정정).
      근거로 든 "두 장이 완전 동일" 은 **차트만** 본 것이다. 표를 보면 배너군이 서로 다르고
      s82 는 시나리오별 배너로 실제 값까지 채워져 있다.
    임계 22 는 관측 구간이 [23, 27] 로만 좁혀진 값이다. 분리/비분리 **판정 자체는** LG 82블록에서
    반례가 없지만, 임계의 정확한 위치는 미결이다 → OPEN_QUESTIONS Q-MAP-01.
  not_implemented:
    - "3장 이상으로 나뉘는 경우. 관측이 2장뿐이라 `마지막 배너군 1개만 분리` 로 좁혀 두었다"
    - "장별로 base_unit 정의가 달라지는 경우 — deck:LG s84 가 유일한 후보인데 정답지 결함으로 판정했다
       (GOLDEN_SET §5-g-1). 규칙으로 승격하지 않는다 → OPEN_QUESTIONS Q-BASE-01"

# ---------------------------------------------------------------------------
# 1. 정규화 — 문자열 비교 전에 항상 적용한다
#    Chart type 은 통제 어휘가 아니라 자유 서술이다 (transcript:34:16)
# ---------------------------------------------------------------------------
normalization:
  confidence: 확정
  evidence: ["guide:LG#'전체 : 가로 막대' vs '전체 : 가로막대' vs '전체 : 가로막대 그래프' 동시 존재"]
  steps:
    - lower_fullwidth_colon: {"：": ":"}
    - collapse_spaces_around_colon: true      # "배너 : 표" == "배너: 표"
    - equivalence_groups:
        - ["가로막대", "가로 막대", "가로막대 그래프", "가로 막대 그래프"]
        - ["세로막대", "세로 막대", "세로막대 그래프", "세로 막대 그래프"]
        - ["가로겹침막대", "가로 겹침막대", "가로 겹침 막대", "가로 겹침 막대 그래프"]
        - ["원그래프", "원 그래프"]
    - strip_all_whitespace: true

# ---------------------------------------------------------------------------
# 2. 관찰된 어휘 — 예시 2건에서 연구원이 실제로 타이핑한 문자열 전량
# ---------------------------------------------------------------------------
vocabulary:
  - string: "전체 : 가로막대, 배너 : 표"
    freq: {LG: 28, SKEE: 24}
    role: 기본형
    variants: ["전체 : 가로 막대", "전체 : 가로 막대 그래프", "전체 : 가로막대 그래프", "전체 : 가로막대"]
    variant_freq: {LG: 5, SKEE: 0}
  - string: "전체 : +-세로막대 그래프"
    freq: {LG: 36, SKEE: 42}
    role: 척도
  - string: "전체 : 가로겹침막대, 배너 : 표"
    freq: {LG: 11, SKEE: 1}
    role: 순위
    variants: ["전체 : 가로 겹침막대, 배너 : 표", "전체 : 가로 겹침 막대 그래프"]
    variant_freq: {LG: 2, SKEE: 1}
  - string: "전체 : 원그래프, 배너: 표"
    freq: {LG: 2, SKEE: 0}
    role: 예/아니오
    variants: ["전체 : 원그래프"]
    variant_freq: {LG: 1, SKEE: 0}
  - string: "전체 : 표"
    freq: {LG: 1, SKEE: 0}
    role: 응답자특성
  - string: "전체 : 가로 누적 100% 막대 그래프"
    freq: {LG: 1, SKEE: 0}
    role: 누적구성비
    note: "가이드에서는 요약 패널(LG B153)에만 등장. 본문 5장은 연구원이 기본형으로 적었으나 제작팀이 이 형태로 만들었다 → disagreements/D-001"
  - string: "전체 : 100% 3점막대 + 가로막대"
    freq: {LG: 0, SKEE: 15}
    role: 척도3점리코드
    note: "SKEE 하우스 스타일. 좌=불만족/보통/만족 100% 세로막대, 우=사유 가로막대(서브베이스)"
  - string: "top2 : 세로막대 그래프, 5점평균 : 상단 표"
    freq: {LG: 0, SKEE: 4}
    role: 척도요약KPI
  - string: "전체 : 세로 막대"
    freq: {LG: 0, SKEE: 1}
    role: 항목별TOP2비교
  - string: "세로 100% 막대"
    freq: {LG: 0, SKEE: 1}
    role: 누적구성비세로
  - string: "좌 : IPA, 우: 가로 겹침 막대"
    freq: {LG: 0, SKEE: 1}
    role: IPA
  - string: "전체 : 텍스트 박스"
    freq: {LG: 0, SKEE: 2}
    role: 텍스트
    variants: ["TEXT 박스"]
    variant_freq: {LG: 0, SKEE: 2}
  - string: "+/- 5점 척도 (9,10점을 0보다 위로 넣어주세요)"
    freq: {LG: 0, SKEE: 1}
    role: 자유서술
    note: "10점 척도 기준선 이동 지시. 제작본은 표준 +-세로막대로 실현됨 → disagreements/D-004"
  - string: "제목 - 내용 형태의 박스 3개 -> 총결론 박스 하나 구성 부탁드립니다."
    freq: {LG: 1, SKEE: 0}
    role: 자유서술
  - string: "표지"
    freq: {LG: 1, SKEE: 1}
    role: 구조
  - string: "목차"
    freq: {LG: 1, SKEE: 1}
    role: 구조
  - string: "간지"
    freq: {LG: 6, SKEE: 10}
    role: 구조

# ---------------------------------------------------------------------------
# 3. 결정표 — 위에서부터 첫 매치로 확정한다 (ordered, first-match-wins)
# ---------------------------------------------------------------------------
decision_table:

  - id: CT-000
    name: 구조 슬라이드
    when: {slide_role: [표지, 목차, 간지]}
    then:
      chart_type: "{slide_role}"        # 그대로 '표지' / '목차' / '간지'
      chart_count: 0
      table_count: 0
    confidence: 확정
    evidence: ["guide:LG#표지/목차/간지", "guide:SKEE#표지/목차/간지", "deck:LG#by_layout(cover/contents/section)"]

  - id: CT-010
    name: 응답자 특성
    when: {slide_role: 응답자특성}
    then:
      chart_type: "전체 : 표"
      chart_count: 0
      table_count: 1
      banner_scope: 전체값만
    confidence: 확정
    evidence: ["transcript:30:46", "transcript:20:30", "guide:LG#표1"]
    note: >
      통계표 표1은 항상 응답자 특성이고 행 라벨이 2열이다.
      `전체 : 표` 는 이 슬라이드 전용이다 — 일반 단일선택 문항에 쓰면 제작팀이
      기본형으로 바꿔 만든다 (disagreements/D-003).

  - id: CT-020
    name: 척도 (BOT/SoSo/TOP 요약행 존재)
    when:
      table.has_scale_rows: true
      table.has_mean_row: true
      table.is_summary: false
    then:
      chart_type: "전체 : +-세로막대 그래프"
      graph_top_text_rows: ["【TOP{k}】", "[{scale_points}점 평균]"]   # 통계표 표기 (대상 행 선택용)
      graph_top_text_medium: 표 상단 행     # 제작본 표기는 `TOP3(%)` / `7점 평균(점)` (TT-010)
      row_order: [option_asc, total, bot, soso, top, mean]   # 가이드 그리드(통계표)의 행 순서
      option_axis: scale_diverging                            # 차트에서 보기는 **계열**이다 (SORT-010)
    confidence: 확정
    evidence: ["transcript:30:54", "transcript:32:12", "transcript:32:20", "guide:LG(36)", "guide:SKEE(42)", "deck:LG#COLUMN_STACKED(36)", "deck:SKEE#COLUMN_STACKED_100(42)"]
    note: >
      k = 2 (5점 척도) 또는 3 (7점 척도). scale_points 로 결정한다.
      "척도 문항은 무조건 플러스 마이너스 세로 막대 그래프" (transcript:32:12)

  - id: CT-030
    name: 순위
    when:
      table.is_ranking: true
    then:
      chart_type: "전체 : 가로겹침막대, 배너 : 표"
      pair_with: "동일 question_code 의 rank_is_first_only 표"
      merge_to_one_slide: true
      sort_by: 넓은_순위_스코프          # 1~N순위 값 내림차순
      option_axis: rank_sum_desc        # 카테고리축 정렬키 = 1+N순위 합 (SORT-030)
      first_rank_columns: [전체]        # 1순위 표에서는 전체 값만 가져온다
    confidence: 확정
    evidence: ["transcript:27:24", "transcript:28:46", "transcript:29:04", "guide:LG(11)", "deck:LG#BAR_CLUSTERED 카테고리 공유 2계열 (15)"]

  - id: CT-040
    name: 예/아니오
    when:
      question.response_type: 예-아니오
      table.n_option_rows: 2
      table.has_scale_rows: false
    then:
      chart_type: "전체 : 원그래프, 배너: 표"
    confidence: 확정
    evidence: ["transcript:36:34", "transcript:37:19", "deck:LG#DOUGHNUT(3)"]
    note: >
      보기가 3개 이상이면 원그래프를 쓰지 않는다. LG s17(A1, 보기 4개)은
      연구원이 원그래프로 적었으나 제작팀이 가로막대로 바꿨다 (disagreements/D-002).
      선택 기준은 설득력이 아니라 미관이다 — "그냥 보기 예쁘면 그렇게 쓰는 거예요" (transcript:37:34)

  - id: CT-050
    name: 등급형 매트릭스 (정도·빈도 사다리) → 누적 100% 가로막대
    # when 은 실행기가 평가할 수 있는 구조 신호만 쓴다.
    # (키워드로 "등급형"을 추측하는 방식은 오탐이 많아 폐기했다 — 아래 note)
    when:
      table.has_scale_rows: true
      table.has_mean_row: false
