    applies_to: [100% 세로누적막대]
    realized: "4~7번째 계열이 [5점 평균]·[평균: 원]·[NPS]. 눈금에 안 잡히고 라벨만 뜬다"
    observed: 39
    cases: [1_SKEE, 4_물리보안]
  두번째_plot:
    applies_to: [세로묶음막대]
