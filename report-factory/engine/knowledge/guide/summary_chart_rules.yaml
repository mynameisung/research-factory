    note: 표 매체가 가장 흔하고 어느 차트에나 붙는다. 계열 매체는 100% 누적에만 붙는다

# ---------------------------------------------------------------------------
# 4. 행 절단 (doc:19#3)
# ---------------------------------------------------------------------------
row_cut:
  prefer: 값 기준
  forms:
    값_기준:   {문구: ["* 1순위 기준 3.0%미만 미제시", "* 3.0%미만 미제시", "* 1+2+3순위 기준 10% 미만 제외"], observed: 20, cases: 2}
    순위_기준: {문구: ["* 상위 10위까지만 제시", "* 상위 5위까지만 제시"], observed: 3, cases: 1}
  rule: >
    개수로 자르면(「상위 4」) 표마다 잘리는 위치가 달라지고 독자가 「4위까지만 의미가
    있다」로 잘못 읽는다. 값으로 자르면 잘린 이유가 문구에 드러난다.
    같은 고객사(에스원)의 선례는 값 기준 하나뿐이다.
  footnote_needed_when: 되돌리지 않고 잘라 합이 깨질 때. 「기타」에 되돌려 합 100 을 지키면 각주가 필요 없다
  not_a_cut: 평균 행을 차트에서 빼 텍스트로 올리는 것은 절단이 아니라 지표 배치다
